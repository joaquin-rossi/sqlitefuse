[package]
name = "sqlitefuse"
authors = ["Joaquín Rossi"]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Read-only FUSE filesystem that shows an SQLite database as a directory of JSONL files"
license = "AGPL-3.0-or-later"
repository = "https://github.com/joaquin-rossi/sqlitefuse"
documentation = "https://github.com/joaquin-rossi/sqlitefuse#readme"
readme = "README.md"
keywords = ["sqlite", "fuse", "filesystem", "jsonl"]
categories = ["filesystem", "command-line-utilities"]
# Cargo.toml and Cargo.lock go in anyway
include = ["src/", "tests/", "example/", "README.md", "LICENSE"]

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.8", features = ["derive"] }
clap_mangen = "0.3.4"
fuser = "0.18.0"
libc = "0.2.191"
log = "0.4.35"
rusqlite = { version = "0.43.0", features = ["bundled", "column_metadata", "functions", "limits"] }
ryu = "1.0.23"

[dev-dependencies]
proptest = "1.12.0"
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
